plugins { id 'com.android.application' }

android {
    namespace 'app.jyoti'
    compileSdk 34

    defaultConfig {
        applicationId "app.jyoti"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        // the web app is the single source of truth — it is not duplicated here
        main.assets.srcDirs += ['../../app']
    }

    buildTypes {
        release {
            minifyEnabled false
            // unsigned by default; CI signs it when the signing secrets are present
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pins every Kotlin artifact to one version. Without it appcompat's
    // kotlin-stdlib 1.8.22 collides with a transitive kotlin-stdlib-jdk8 1.6.21:
    // the jdk7/jdk8 artifacts were folded into kotlin-stdlib in Kotlin 1.8, so
    // the two jars declare the same classes and checkDuplicateClasses fails.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'

    // On-device LLM, so the Pandit chat can run with no key and no network.
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
}
