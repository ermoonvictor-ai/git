plugins { id 'com.android.application' }

android {
    namespace 'app.jyoti'
    compileSdk 34

    defaultConfig {
        applicationId "app.jyoti"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        // the web app is the single source of truth — it is not duplicated here
        main.assets.srcDirs += ['../../app']
    }

    buildTypes {
        release {
            minifyEnabled false
            // unsigned by default; CI signs it when the signing secrets are present
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
