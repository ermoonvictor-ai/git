name: Build APK

# Produces a downloadable APK. Run it from the Actions tab
# ("Build APK" -> "Run workflow"), or push a v* tag to also get a Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the artifact
        id: name
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jyoti-apk-${{ steps.name.outputs.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      # A release asset is the only artifact with a stable, unauthenticated
      # download URL, so give it a predictable filename:
      #   .../releases/download/<tag>/jyoti-<tag>.apk
      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "jyoti-${{ github.ref_name }}.apk"

      - name: Attach to release on a v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jyoti-${{ github.ref_name }}.apk
          name: Jyoti ${{ github.ref_name }}
          body: |
            Offline Vedic astrology and palm reading. Install the APK below.

            It is debug-signed rather than Play-Store signed, so Android will
            ask you to allow "install unknown apps" for whichever app you open
            it with.

            The app requests no INTERNET permission: nothing it holds — birth
            details, palm photographs — can leave the device.
